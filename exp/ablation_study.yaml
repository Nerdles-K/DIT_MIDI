# Ablation Study Configuration
# ============================
# Parameter sensitivity analysis for sampling steps and temperature

experiments:
  # Sampling steps ablation (fixed temperature=1.0)
  sampling_steps:
    baseline: 50
    variations: [25, 75, 100]
    fixed_params:
      temperature: 1.0
      duration: 10.0
    
  # Temperature ablation (fixed steps=50)
  temperature:
    baseline: 1.0
    variations: [0.7, 0.9, 1.1, 1.3]
    fixed_params:
      num_steps: 50
      duration: 10.0

# Reduced prompt set for ablation (10 prompts, 2 repeats each)
# Use representative prompts from each difficulty level
ablation_prompts:
  - easy_01  # piano melody in C
  - easy_05  # drums rhythm pattern
  - easy_08  # saxophone melody in Bb
  
  - medium_01  # happy piano melody in C
  - medium_02  # sad violin melody in Am
  - medium_06  # slow saxophone melody in F
  - medium_09  # bright trumpet melody in D
  
  - hard_01  # happy energetic piano melody in C major
  - hard_05  # dark mysterious cello melody in A minor
  - hard_10  # groovy rhythmic bass line in A major

evaluation:
  num_repeats: 2  # Reduced for faster ablation studies
  
# Output organization
output_structure:
  base_dir: evaluation_outputs/ablation
  steps_dir: evaluation_outputs/ablation/sampling_steps
  temp_dir: evaluation_outputs/ablation/temperature
